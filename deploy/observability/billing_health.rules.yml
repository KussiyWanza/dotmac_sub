# Billing health alerts (companion to the billing_health snapshot).
#
# Deploy-ready Prometheus rule group for the dotmac-observe stack. The billing
# health snapshot exports every signal as
# observability_state{domain="billing_health"}, and raises a named anomaly for
# each. Those anomalies now all reach a log line; these rules cover the ones
# that had no alert at all.
#
# Threshold note: the historic aged-draft stock is review inventory, not a
# current-incident signal. It stays visible on the dashboard. The alert uses a
# fixed 24-48-hour creation cohort instead, so a July draft cannot manufacture
# an August incident merely by crossing an age threshold.
groups:
  - name: billing_health
    rules:
      # --- Signals currently at zero: any occurrence is a real regression.
      - alert: SubInvoicesPaidWithoutIssue
        expr: observability_state{domain="billing_health",signal="invoices_paid_without_issue"} > 0
        for: 30m
        labels:
          severity: warning
          area: billing
          owner: financial-billing
        annotations:
          summary: "Invoices are past draft with no issue date"
          description: >
            {{ $value }} invoice(s) are past draft carrying no issue date. They
            cannot age, cannot go overdue, and drop out of any read that filters
            on issue date, so they are invisible to dunning.
          runbook: "docs/adr/0007-end-to-end-billing-target-architecture.md"

      - alert: SubBillingProfileMismatch
        expr: observability_state{domain="billing_health",signal="billing_profile_mismatch"} > 0
        for: 30m
        labels:
          severity: warning
          area: billing
          owner: financial-billing
        annotations:
          summary: "Account and subscription billing modes disagree"
          description: >
            {{ $value }} account/subscription billing-mode mismatch(es).
            Enforcement reads a mode the subscription contradicts, so the wrong
            policy can be applied to the account.

      - alert: SubBillingProfileMixedModes
        expr: observability_state{domain="billing_health",signal="billing_profile_mixed_modes"} > 0
        for: 30m
        labels:
          severity: warning
          area: billing
          owner: financial-billing
        annotations:
          summary: "Accounts carry subscriptions in more than one billing mode"
          description: >
            {{ $value }} account(s) hold subscriptions in multiple billing
            modes, so no single enforcement policy applies to the account.

      - alert: SubActiveSubscriptionsWithoutBillingPath
        expr: observability_state{domain="billing_health",signal="unbilled_active_subscriptions"} > 0
        for: 1h
        labels:
          severity: warning
          area: billing
          owner: financial-billing
        annotations:
          summary: "Active subscriptions have no canonical billing path"
          description: >
            {{ $value }} active prepaid subscription(s) have no canonical
            recurring billing path — service is being delivered that nothing
            will ever invoice. Expected to be firing on adoption; drive to zero
            rather than silencing.

      - alert: SubPaymentReceiptEmailTemplateUnavailable
        expr: observability_state{domain="billing_health",signal="payment_receipt_email_template_ready",scope="all"} == 0
        for: 30m
        labels:
          severity: warning
          area: billing
          owner: customer-communications
        annotations:
          summary: "Payment receipt email template is unavailable"
          description: >
            The payment_received email template is missing, inactive, invalid,
            or lacks the receipt reference/link fields. Payment processing is
            unaffected, but customers receive no usable receipt. Follow the
            email-only canary and rollback gates before activation.
          runbook: "docs/runbooks/MONEY_PATH_OPERATIONAL_CLOSURE.md"

      # --- Current creation cohort, independent of historical threshold ageing.
      - alert: SubRecentDraftInvoiceCohortStalled
        expr: observability_state{domain="billing_health",signal="stalled_draft_invoice_cohort",scope="all"} > 25
        for: 1h
        labels:
          severity: warning
          area: billing
          owner: financial-billing
        annotations:
          summary: "A recent draft invoice cohort is stalled"
          description: >
            {{ $value }} invoices created 24-48 hours ago remain draft. This
            measures the current issuance lifecycle and cannot be triggered by
            an older cohort crossing a 30-day age threshold.

      - alert: SubPrepaidFundingQuarantineGrowing
        expr: delta(observability_state{domain="billing_health",signal="prepaid_funding_quarantined",scope="all"}[24h]) > 0
        for: 30m
        labels:
          severity: warning
          area: prepaid-enforcement
          owner: financial-collections
        annotations:
          summary: "Prepaid funding quarantine gained accounts"
          description: >
            The fail-closed prepaid funding cohort increased by {{ $value }} in
            24 hours. Existing legacy stock is remediation work; growth is the
            prevention signal that another active account surfaced without an
            attested baseline.
          runbook: "docs/runbooks/PREPAID_FUNDING_AUDIT_RESTORE.md"

      # `scope` is load-bearing here. The signal carries several series: `all`
      # is the live violation total, `opening_balance` is the balance carried
      # in at the Splynx handoff — 13,312 rows that no reconciler can allocate
      # and which the snapshot deliberately never raises as an anomaly. Without
      # the selector this rule sums both and fires on migration carry-in.
      - alert: SubAccountCreditInvariantViolationsGrowing
        expr: delta(observability_state{domain="billing_health",signal="account_credit_invariant_violations",scope="all"}[6h]) > 0
        for: 1h
        labels:
          severity: warning
          area: billing
          owner: financial-billing
        annotations:
          summary: "Account credit invariant violations are increasing"
          description: >
            Live violations grew by {{ $value }} in 6h, so something is still
            writing them rather than only historical drift remaining. Break the
            total down by scope to see which invariant:
            observability_state{domain="billing_health",signal="account_credit_invariant_violations"}

      # --- Exposure that cannot be measured is not the same as zero exposure.
      - alert: SubNegativePrepaidExposureUnmeasurable
        expr: >
          absent(observability_state{domain="billing_health",signal="negative_prepaid_balance_accounts"})
          and on() observability_state{domain="billing_health",signal="active_subscriptions"} > 0
        for: 2h
        labels:
          severity: warning
          area: prepaid-enforcement
          owner: financial-collections
        annotations:
          summary: "Prepaid exposure is being reported as unavailable"
          description: >
            The negative-prepaid-exposure gauge is absent while the snapshot is
            otherwise publishing, which the resolver does deliberately when a
            funding baseline is missing — reporting unavailable rather than a
            false zero. The exposure figure is blind until it is repaired.
