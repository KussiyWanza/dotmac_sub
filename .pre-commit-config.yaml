repos:
  # Ruff: fast linting + formatting (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      # docs/kernel-runtime-composition.json and docs/kernel-runtime-
      # readiness.json are strict-JSON evidence documents, not formattable
      # source — `ruff format` rewrites a trailing comma into them that
      # `json.load` then refuses. pyproject.toml's [tool.ruff] extend-exclude
      # already keeps a directory-walk `ruff`/`ruff-format` invocation off
      # both files, but a pre-commit hook passes each *changed* file's exact
      # path on the command line, which bypasses that exclude — so the same
      # two paths are excluded here too, explicitly, not just in
      # pyproject.toml. Their JSON validity is enforced instead by
      # tests/architecture/test_strict_json_evidence_documents.py.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^docs/(kernel-runtime-composition|kernel-runtime-readiness)\.json$
      - id: ruff-format
        exclude: ^docs/(kernel-runtime-composition|kernel-runtime-readiness)\.json$

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^static/(css/main\.css$|vendor/|js/vendor/)
      - id: end-of-file-fixer
        # Generated, minified Tailwind output; the build strips the trailing
        # newline on every rebuild, so don't enforce it here.
        exclude: ^static/(css/main\.css$|vendor/|js/vendor/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements  # no pdb/breakpoint() in commits
      # Every entry below is a literal PEM *header string* in a placeholder,
      # fixture or form hint — none contain key material. Adding a real file
      # here to make the hook pass is how a live OpenVPN server key stayed
      # public for five months; `ci-secret-scan` in ci.yml now scans the tree
      # independently of this list so silencing the hook is no longer enough.
      - id: detect-private-key  # catch accidental key commits
        exclude: (templates/admin/network/nas/device_form\.html|docs/superpowers/plans/2026-03-29-router-management\.md|tests/test_router_management_schemas\.py|tests/test_web_vpn_management_service\.py)

  # Security: bandit static analysis
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -q]
        additional_dependencies: ["bandit[toml]"]
        exclude: (tests/|alembic/|scripts/|mobile/)

  # Security: detect hardcoded secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # configs/ deliberately NOT excluded: it holds generated PKI/VPN output.
        exclude: (\.env\.example|tests/|alembic/|scripts/|templates/|docs/|\.playwright-mcp/)
