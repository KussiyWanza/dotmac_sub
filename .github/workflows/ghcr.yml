name: Build & Push to GHCR

# Builds one immutable image per commit on dev and main. Dev images are
# staging-only; only the default branch receives the moving `latest` tag.
# This is the sole image publisher and is the staging deployment trigger.
# Production can therefore pull a main-built image while staging tests the
# exact dev commit before promotion.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dotmac-sub-application
          cache-to: type=gha,mode=max,scope=dotmac-sub-application

  # GenieACS used to be the one service compose still built on the production
  # host (`build: context: .`), which is why a prod box had to keep a full
  # application checkout. Build it here instead so the host only ever pulls.
  #
  # The tag is pinned to the upstream genieacs version in docker/genieacs/Dockerfile.
  # Bump both together; `latest` is deliberately NOT published for this image.
  build-and-push-genieacs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pinned GenieACS version
        id: version
        run: |
          set -euo pipefail
          # Single source of truth for the tag: the `npm install -g genieacs@X`
          # line in the Dockerfile. Keeps the published tag from drifting away
          # from the version actually baked into the image.
          version="$(grep -oE 'genieacs@[0-9]+\.[0-9]+\.[0-9]+' docker/genieacs/Dockerfile \
            | head -1 | cut -d@ -f2)"
          test -n "$version" || { echo "could not parse genieacs version from Dockerfile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "GenieACS version: $version"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Context is docker/genieacs, not the repo root: the image needs
          # nothing from the application tree.
          context: docker/genieacs
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-genieacs:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=genieacs
          cache-to: type=gha,mode=max,scope=genieacs
