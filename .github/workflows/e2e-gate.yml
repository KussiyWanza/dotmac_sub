name: E2E Gate

# Always-reported PR check: reports success immediately when the PR touches
# nothing e2e-relevant, and runs the full Playwright suite (with the
# known-failure quarantine ratchet) when it does. Branch protection can
# require "E2E Gate" without ever waiting on a skipped workflow.

on:
  pull_request:

concurrency:
  group: e2e-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.13"
  POETRY_VERSION: "2.4.1"
  # Read auth for the private Forgejo PyPI index (dotmac-kernel). Same
  # ci-reader pattern as ci.yml; token source of record is OpenBao
  # (secret/dotmac/forgejo/read-token).
  POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
  POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}

jobs:
  gate:
    name: E2E Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this PR is e2e-relevant
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE \
            '^(templates/|static/|tests/playwright/|app/web/|app/services/web_|scripts/seed/|\.github/workflows/e2e)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "**E2E Gate: running the Playwright suite.**" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No e2e-relevant paths changed — gate passes without a run."
            # A green check that ran nothing is indistinguishable, on the PR
            # page, from a green check that ran 259 browser specs. On
            # 2026-08-29 that difference was read as a branch-specific
            # signal: a money PR was blamed for a red suite while sibling
            # PRs "passed" the same gate without launching a browser. Say so
            # where a reviewer actually looks.
            {
              echo "**E2E Gate: the Playwright suite did NOT run.**"
              echo
              echo "This PR changes no e2e-relevant path, so the gate reports"
              echo "success without launching a browser. This green is NOT"
              echo "evidence that the browser suite passes at this head."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Start database + redis
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          docker network create e2e-net
          docker run -d --name e2e-db --network e2e-net \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=dotmac_sub_e2e \
            --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres" --health-interval 5s \
            --health-retries 10 postgis/postgis:16-3.4
          docker run -d --name e2e-redis --network e2e-net \
            -p 127.0.0.1:56379:6379 redis:7
          for i in $(seq 1 30); do
            [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' e2e-db)" = "healthy" ] && break
            sleep 2
          done
          # Exhausting the loop above used to fall through with exit 0. A
          # database that never came up was then reported by the NEXT step as
          # an opaque "database connection or role operation failed", naming
          # migrations for a fault that was service startup. Readiness is a
          # precondition of this step, so prove it here and fail loudly.
          if [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' e2e-db)" != "healthy" ] || ! docker exec e2e-db pg_isready -h 127.0.0.1 -U postgres -d postgres >/dev/null 2>&1; then
            echo "::error::e2e-db did not become ready within 60s"
            docker inspect --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' e2e-db || true
            docker logs e2e-db || true
            exit 1
          fi
          # Redis had no readiness check at all, which is the same defect in
          # its most complete form: an unproven precondition.
          for i in $(seq 1 30); do
            docker exec e2e-redis redis-cli ping >/dev/null 2>&1 && break
            sleep 2
          done
          if ! docker exec e2e-redis redis-cli ping >/dev/null 2>&1; then
            echo "::error::e2e-redis did not become ready within 60s"
            docker logs e2e-redis || true
            exit 1
          fi

      - name: Install Python + Poetry
        if: steps.relevance.outputs.relevant == 'true'
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore Poetry installation
        if: steps.relevance.outputs.relevant == 'true'
        id: poetry-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-v1-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.POETRY_VERSION }}

      - name: Install Poetry
        if: steps.relevance.outputs.relevant == 'true' && steps.poetry-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/poetry" config virtualenvs.create true
          "$HOME/.local/bin/poetry" config virtualenvs.in-project true

      - name: Remove repository development environment pointer
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          if [ -L .venv ]; then
            rm .venv
          fi

      - name: Restore Python environment
        if: steps.relevance.outputs.relevant == 'true'
        id: python-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: python-venv-v3-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install dependencies + browser
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          if [ "${{ steps.python-cache.outputs.cache-hit }}" != "true" ]; then
            poetry install --no-interaction
          fi
          poetry run playwright install chromium --with-deps

      - name: Migrate + seed + start app from this PR's code
        if: steps.relevance.outputs.relevant == 'true'
        env:
          DATABASE_URL: "postgresql+psycopg://postgres@127.0.0.1:55432/dotmac_sub_e2e"
          SECRET_KEY: "e2e-test-secret-key-not-for-production"
          REDIS_URL: "redis://127.0.0.1:56379/0"
        run: |
          BOOTSTRAP_DATABASE_URL="$DATABASE_URL" \
            poetry run python scripts/bootstrap_commercial_module_prereqs.py
          BOOTSTRAP_DATABASE_URL="$DATABASE_URL" \
            poetry run python scripts/bootstrap_outbox_dispatcher_roles.py --repair
          poetry run alembic upgrade heads
          poetry run python -m scripts.seed.seed_rbac
          poetry run python -m scripts.seed.seed_admin \
            --email e2e.admin@example.com --first-name E2E --last-name Admin \
            --username e2e.admin@example.com --password "E2eAdminPass123!"
          JWT_SECRET="$(openssl rand -hex 32)" \
            TOTP_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" \
            nohup poetry run uvicorn app.main:app --host 127.0.0.1 --port 8001 \
            > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "app never became healthy"; tail -50 uvicorn.log; exit 1

      - name: Run Playwright suite
        if: steps.relevance.outputs.relevant == 'true'
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:8001"
          PLAYWRIGHT_BROWSER: "chromium"
          TEST_DATABASE_URL: "postgresql+psycopg://postgres@127.0.0.1:55432/dotmac_sub_e2e"
          E2E_REDIS_URL: "redis://127.0.0.1:56379/0"
          E2E_ADMIN_USERNAME: "e2e.admin@example.com"
          E2E_ADMIN_PASSWORD: "E2eAdminPass123!"
        run: |
          poetry run pytest tests/playwright/ -v --tb=short -o "addopts="

      - name: Upload browser failure evidence
        if: failure() && steps.relevance.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          # test-results/ holds a Playwright trace, video, screenshot,
          # browser console log and network log per FAILING spec (see
          # tests/playwright/evidence.py). Without these a browser failure
          # whose symptom is "no request ever reached the server" has no
          # evidence at all on the server side, and the only remaining
          # response is a re-run — which is not a diagnosis.
          path: |
            test-results/
            uvicorn.log
          if-no-files-found: warn
          retention-days: 14

      - name: App log on failure
        if: failure() && steps.relevance.outputs.relevant == 'true'
        run: |
          grep -n -B 120 -A 20 -E '"status": 500|HTTP/1.1" 500|Error loading customer detail|/admin/customers/person/|customer[-_]retention' uvicorn.log || true
          tail -500 uvicorn.log || true

      - name: Cleanup
        if: always() && steps.relevance.outputs.relevant == 'true'
        run: |
          docker rm -f e2e-db e2e-redis 2>/dev/null || true
          docker network rm e2e-net 2>/dev/null || true
