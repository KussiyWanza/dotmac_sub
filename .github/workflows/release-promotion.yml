name: Promote staged digest for production

on:
  workflow_dispatch:
    inputs:
      candidate_build_run_id:
        description: Successful Build release candidate once run ID
        required: true
        type: string
      staging_deployment_run_id:
        description: Successful Deploy main to staging run ID
        required: true
        type: string
      staged_release_sha:
        description: Exact full SHA of the staged candidate to authorize
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production-promotion-${{ inputs.staged_release_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  authorize-and-promote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # This job mutates GHCR (moves the production version/latest aliases)
      # after a human approval, so it must never be attempted a second time
      # under the same run: a rerun after a partial failure would re-enter the
      # approval gate and re-execute the alias move rather than restaging a
      # fresh, re-verifiable candidate. Mirrors the same refusal already
      # enforced by infrastructure-reconcile-apply.yml and
      # legacy-image-pin-bootstrap-apply.yml's `apply` jobs.
      - name: Refuse a rerun of this approval-gated promotion
        uses: actions/github-script@v7
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            if (process.env.RUN_ATTEMPT !== "1") {
              core.setFailed(
                "Promotion reruns are not admissible: a partial failure after " +
                "production approval must be re-dispatched as a new run from " +
                "candidate build forward, not rerun in place."
              );
            }

      # The checkout is the AUTHORIZATION identity: protected `main`, whose
      # checked-in workflow and verifier code perform this authorization. It is
      # deliberately NOT the artifact being released.
      #
      # Pinned to github.sha, not `ref: main` (found 2026-09-09, confirmed live
      # in production): this job carries a job-level `environment: production`
      # approval gate, so every step in it -- including this checkout -- runs
      # AFTER the human approval, not before. `ref: main` used to re-resolve at
      # that later point, so a merge landing on main during the approval wait
      # silently rebound this checkout, and therefore authorization_main_sha
      # below, to a commit nobody had actually approved. production-deploy.yml
      # compares against this run's `head_sha`, frozen at dispatch time, so the
      # two values could diverge -- production-deploy.yml only caught it one
      # stage later, after this job had already mutated GHCR aliases.
      # `github.sha` is the exact protected-main commit this run was
      # dispatched against, so pinning to it keeps this checkout from moving
      # out from under the approval and matches what production-deploy.yml
      # independently checks.
      - name: Checkout current protected main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve authorizing main and the staged release separately
        id: release
        env:
          STAGED_SHA: ${{ inputs.staged_release_sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main" || {
            echo "Dispatch this workflow with --ref main." >&2
            exit 1
          }
          printf '%s' "$STAGED_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "staged_release_sha must be a full lowercase Git SHA." >&2
            exit 1
          }
          authorization_main_sha="$(git rev-parse HEAD)"

          # Canary against the pin above (`ref: ${{ github.sha }}`) ever being
          # silently reverted back to a moving ref like `ref: main`. This
          # detects the checkout's `ref:` no longer matching `github.sha` --
          # it cannot detect `github.sha` itself being wrong, since the
          # checkout is configured FROM github.sha. That is the regression
          # worth catching; it fails loudly and closed here, before any side
          # effect, rather than confusingly downstream in
          # production-deploy.yml's verify step.
          test "$authorization_main_sha" = "$GITHUB_SHA" || {
            echo "Refusing production authorization: the authorizing checkout ($authorization_main_sha) is not the dispatched commit ($GITHUB_SHA)." >&2
            exit 1
          }

          # Reachability, not identity. The staged commit must still be on the
          # protected branch -- not reverted, not orphaned, not from a fork --
          # but `main` is free to have moved on since it was staged. Requiring
          # equality here is what previously forced a rebuild and restage every
          # time anything landed on main.
          git merge-base --is-ancestor "$STAGED_SHA" "$authorization_main_sha" || {
            echo "Refusing production authorization: $STAGED_SHA is not an ancestor of main ($authorization_main_sha)." >&2
            exit 1
          }

          # The tree comes from the STAGED commit, never from the checkout,
          # which is a different commit whenever main has advanced.
          staged_tree="$(git rev-parse "${STAGED_SHA}^{tree}")"

          echo "authorization_main_sha=$authorization_main_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$STAGED_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$staged_tree" >> "$GITHUB_OUTPUT"

      - name: Require exact successful source, staging, and main runs
        uses: actions/github-script@v7
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_build_run_id }}
          STAGING_RUN_ID: ${{ inputs.staging_deployment_run_id }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          # RELEASE_SHA is the staged candidate: the CI that matters is the CI
          # that ran on the code being deployed, not on a later main tip that
          # nothing was built from.
          script: |
            const candidateId = Number(process.env.CANDIDATE_RUN_ID);
            const stagingId = Number(process.env.STAGING_RUN_ID);
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (!Number.isSafeInteger(candidateId) || candidateId <= 0 ||
                !Number.isSafeInteger(stagingId) || stagingId <= 0) {
              core.setFailed("Candidate and staging run IDs must be positive integers.");
              return;
            }
            for (const expected of [
              [candidateId, "Build release candidate once", "main", "workflow_dispatch"],
              [stagingId, "Deploy main to staging", "main", "workflow_run"],
            ]) {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: expected[0],
              });
              const run = response.data;
              if (run.name !== expected[1] || run.head_branch !== expected[2] ||
                  run.event !== expected[3] || run.status !== "completed" ||
                  run.conclusion !== "success" ||
                  run.head_repository?.full_name !== expectedRepository) {
                core.setFailed(`Run ${expected[0]} is not accepted ${expected[1]} evidence.`);
                return;
              }
            }
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.RELEASE_SHA,
              event: "push",
              per_page: 100,
            });
            const failures = [];
            for (const workflowName of ["CI", "Mobile CI"]) {
              const run = runs.data.workflow_runs
                .filter((item) => item.name === workflowName &&
                  item.head_sha === process.env.RELEASE_SHA &&
                  item.head_branch === "main" && item.event === "push")
                .sort((left, right) => right.id - left.id)[0];
              if (!run || run.status !== "completed" || run.conclusion !== "success") {
                failures.push(`${workflowName}=not-green`);
              }
            }
            if (failures.length) core.setFailed(`Staged revision checks are not green: ${failures.join(", ")}`);

      - name: Download candidate evidence from exact build run
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-evidence
          path: ${{ runner.temp }}/candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_build_run_id }}

      - name: Download acceptance from exact staging run
        uses: actions/download-artifact@v4
        with:
          pattern: staging-acceptance-*
          path: ${{ runner.temp }}/staging
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.staging_deployment_run_id }}

      - name: Authorize exact staged digest
        id: authorization
        env:
          AUTHORIZATION_MAIN_SHA: ${{ steps.release.outputs.authorization_main_sha }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TREE: ${{ steps.release.outputs.tree }}
          AUTHORIZATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t acceptance_files < <(find "$RUNNER_TEMP/staging" -type f -name acceptance.json)
          test "${#acceptance_files[@]}" -eq 1 || {
            echo "Expected exactly one staging acceptance document." >&2
            exit 1
          }
          candidate_outputs="$RUNNER_TEMP/candidate-outputs"
          python -m scripts.release_candidate_evidence read-candidate \
            --path "$RUNNER_TEMP/candidate/candidate.json" \
            --github-output "$candidate_outputs"
          source_revision="$(sed -n 's/^source_revision=//p' "$candidate_outputs")"
          # The authorized release IS the staged candidate -- exact equality,
          # not ancestry. Ancestry against main was already proven above, and
          # is about reachability of the staged commit, not about which commit
          # the deployed image was built from.
          test "$source_revision" = "$RELEASE_SHA" || {
            echo "Refusing authorization: candidate was built from $source_revision, but $RELEASE_SHA was requested." >&2
            exit 1
          }
          source_tree="$(sed -n 's/^source_tree=//p' "$candidate_outputs")"
          test "$source_tree" = "$RELEASE_TREE" || {
            echo "Refusing authorization: candidate tree $source_tree does not match staged tree $RELEASE_TREE." >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/production-authorization"
          # candidate_build_run_id is the run whose release-candidate-evidence
          # artifact was just downloaded above -- i.e. the run that wrote it.
          # That is the document's evidence_run_id, never its build_run_id,
          # which may legitimately name an earlier resumed build whose image
          # this evidence document was re-derived from.
          python -m scripts.release_candidate_evidence authorize-production \
            --candidate "$RUNNER_TEMP/candidate/candidate.json" \
            --staging "${acceptance_files[0]}" \
            --expected-evidence-run-id "${{ inputs.candidate_build_run_id }}" \
            --expected-staging-deployment-id "${{ inputs.staging_deployment_run_id }}" \
            --authorization-run-id "$AUTHORIZATION_RUN_ID" \
            --authorization-main-revision "$AUTHORIZATION_MAIN_SHA" \
            --release-revision "$RELEASE_SHA" \
            --release-tree "$RELEASE_TREE" \
            --source-revision-is-ancestor \
            --output "$RUNNER_TEMP/production-authorization/authorization.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Re-prove staged reachability after the approval window
        env:
          STAGED_SHA: ${{ steps.release.outputs.sha }}
          AUTHORIZATION_MAIN_SHA: ${{ steps.release.outputs.authorization_main_sha }}
        run: |
          set -euo pipefail
          # The checkout above is pinned to the dispatch-time commit, so it
          # cannot see whatever happened to main during the human approval
          # wait. Re-fetch live and re-check reachability -- not equality,
          # same reasoning as the ancestry check above -- immediately before
          # the first step that mutates GHCR, so a rewrite/force-push that
          # dropped the staged commit off protected main entirely (branch
          # protection should already prevent this; this is defense in depth)
          # is caught before any side effect.
          git fetch --no-tags origin main
          current_main_sha="$(git rev-parse FETCH_HEAD)"
          git merge-base --is-ancestor "$STAGED_SHA" "$current_main_sha" || {
            echo "Refusing production authorization: $STAGED_SHA is no longer an ancestor of main's current tip ($current_main_sha)." >&2
            exit 1
          }
          if [ "$current_main_sha" != "$AUTHORIZATION_MAIN_SHA" ]; then
            echo "::notice title=main advanced during the approval window::main moved from $AUTHORIZATION_MAIN_SHA (dispatch time) to $current_main_sha while this run waited for production approval; $STAGED_SHA remains reachable from both, so promotion continues."
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach production aliases without rebuilding
        env:
          IMAGE_DIGEST: ${{ steps.authorization.outputs.image_digest }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          # Read VERSION out of the STAGED commit. The working tree belongs to
          # the authorizing main checkout, so once main has advanced past the
          # candidate -- which a version-bump PR does immediately after every
          # merge -- reading ./VERSION would tag the staged digest with a
          # version that image was never built from.
          version="$(git show "${RELEASE_SHA}:VERSION" | tr -d '[:space:]')"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          source_ref="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          version_ref="${REGISTRY}/${IMAGE_NAME}:${version}"
          latest_ref="${REGISTRY}/${IMAGE_NAME}:latest"
          # A bare `2>/dev/null || true` here would treat EVERY inspect
          # failure -- a transient registry/auth error just as much as a
          # genuine "this version tag doesn't exist yet" -- identically as
          # "doesn't exist", which then re-points an already-published
          # version tag at a different digest on nothing more than a blip.
          # The post-create verification loop below can't catch that
          # specific failure mode: after the overwrite, the alias legitimately
          # matches the new digest. So distinguish the two like
          # release-candidate.yml's "Inspect existing candidate tag" step
          # does (#3061): a definite negative resolves on the first attempt,
          # anything ambiguous is retried a bounded number of times and then
          # fails closed rather than proceeding as if the tag doesn't exist.
          existing_digest=""
          attempt=1
          max_attempts=3
          while true; do
            if version_manifest_json="$(docker buildx imagetools inspect "$version_ref" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect-version-tag.err")"; then
              existing_digest="$(jq -r '.digest' <<<"$version_manifest_json")"
              break
            fi
            version_tag_error="$(cat "$RUNNER_TEMP/inspect-version-tag.err")"
            # Same definite-negative shapes as release-candidate.yml's
            # tag-existence check, reused rather than re-derived so the two
            # never drift apart.
            if grep -qiE 'manifest unknown|no such manifest|^error: .*: not found$' <<<"$version_tag_error"; then
              existing_digest=""
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Cannot safely determine whether $version_ref already exists; refusing to guess and possibly re-point an already-published version tag." >&2
              printf '%s\n' "$version_tag_error" >&2
              exit 1
            fi
            sleep "$((attempt * 3))"
            attempt=$((attempt + 1))
          done
          alias_args=(--tag "$latest_ref")
          if [ -n "$existing_digest" ]; then
            if [ "$existing_digest" = "$IMAGE_DIGEST" ]; then
              alias_args+=(--tag "$version_ref")
            else
              echo "::notice title=Version alias preserved::$version_ref already points to $existing_digest; leaving it unchanged and advancing only 'latest' to the authorized digest $IMAGE_DIGEST."
            fi
          else
            alias_args+=(--tag "$version_ref")
          fi
          docker buildx imagetools create \
            --prefer-index=false \
            "${alias_args[@]}" \
            "$source_ref"
          for alias in "${alias_args[@]}"; do
            [ "$alias" = "--tag" ] && continue
            alias_digest="$(docker buildx imagetools inspect "$alias" --format '{{json .Manifest}}' | jq -r '.digest')"
            test "$alias_digest" = "$IMAGE_DIGEST" || {
              echo "Alias $alias resolved to $alias_digest, expected $IMAGE_DIGEST." >&2
              exit 1
            }
          done

      - name: Upload production authorization
        uses: actions/upload-artifact@v4
        with:
          name: production-authorization-${{ steps.release.outputs.sha }}
          path: ${{ runner.temp }}/production-authorization/authorization.json
          if-no-files-found: error
          retention-days: 90
