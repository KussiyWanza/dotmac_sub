name: Engineering standards

on:
  # `integration/**` and `consolidate/**` carry multi-PR batches. Without these
  # targets, a PR INTO a batch branch runs no standards check at all, and the
  # whole batch meets Governance for the first time at its merge to dev —
  # exactly the risk these branch families exist to contain.
  push:
    branches: [main, dev, 'integration/**', 'consolidate/**']
  pull_request:
    branches: [main, dev, 'integration/**', 'consolidate/**']
    types: [opened, synchronize, reopened]
  # `Dotmac engineering standards` is a required context on dev. A required
  # context that never reports deadlocks the merge queue: GitHub waits forever
  # for a run that will never exist, and every queued merge stalls. This job
  # must therefore stay reachable from `merge_group` for as long as it is
  # required — the same rule ci.yml and mobile.yml already follow.
  merge_group:

permissions:
  contents: read

jobs:
  standards:
    name: Dotmac engineering standards
    runs-on: ubuntu-latest
    # Schema 9 derives reachability across Sub's 6,000+ tracked files before
    # classifying the connector surface. Five minutes is below the measured
    # clean-run time and would turn a valid adoption into timeout noise.
    timeout-minutes: 10
    steps:
      - name: Check out the evaluated product revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce the accepted Dotmac engineering standards
        uses: michaelayoade/dotmac_governance/.github/actions/standards-check@a19259b10568d29dc0a9617347498fea7f1e7a97
        with:
          default-branch: ${{ github.event.repository.default_branch }}
