name: CI

on:
  # `integration/**` and `consolidate/**` carry multi-PR batches. Without these
  # targets, a PR INTO a batch branch runs no tests at all, and the whole batch
  # meets CI for the first time at its merge to main — exactly the risk these
  # branch families exist to contain.
  push:
    branches: [main, 'integration/**', 'consolidate/**']
  pull_request:
    branches: [main, 'integration/**', 'consolidate/**']
  # A required check that never reports deadlocks the merge queue: GitHub waits
  # forever for a context that no run will ever produce. Every required context
  # in this file must therefore be reachable from `merge_group`.
  merge_group:
  workflow_dispatch:
  # A complete matrix on a fixed cadence. Change classification narrows pull
  # requests only, so without a scheduled complete run there is no periodic
  # execution that is unconditionally whole -- and a classifier defect could sit
  # undetected for as long as no one happened to touch a requiring path.
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The shared .venv embeds an absolute interpreter path, so every artifact
  # consumer must resolve the exact same Python patch release as its producer.
  PYTHON_VERSION: "3.12.13"
  POETRY_VERSION: "2.4.1"
  DATABASE_URL: "sqlite:///./test.db"
  SECRET_KEY: "ci-test-secret-key-not-for-production" # pragma: allowlist secret
  REDIS_URL: "redis://localhost:6379/0"
  # Read auth for the private Forgejo PyPI index (dotmac-kernel). Same
  # ci-reader pattern as dotmac_vendor_control_plane; token source of record
  # is OpenBao (secret/dotmac/forgejo/read-token).
  POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
  POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      postgresql-required: ${{ steps.classify.outputs.postgresql-required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # Classification narrows PULL REQUESTS and nothing else. Every branch
          # tip, every queued merge, every manual invocation and the nightly
          # cadence run the complete matrix, so the selective path can only ever
          # shorten feedback on a proposal -- never the evidence behind a commit
          # that lands, ships, or gets promoted.
          #
          # `integration/**` and `consolidate/**` pull requests are complete too.
          # They carry a whole batch's migrations and, exactly as the migration
          # sequence gate already argues, are the runs least safe to narrow.
          complete=false
          case "$EVENT_NAME" in
            pull_request) ;;
            *) complete=true ;;
          esac
          case "$HEAD_REF" in
            integration/*|consolidate/*) complete=true ;;
          esac

          if [ "$complete" = "true" ]; then
            echo "::notice::Complete matrix: $EVENT_NAME runs are never narrowed by classification."
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "postgresql-required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$PR_BASE_SHA"

          # No usable base: branch creation reports an all-zero "before", and a
          # tag or manual ref push may report none at all. There is nothing to
          # diff against, so run everything rather than guessing.
          #
          # The previous fallback here was `git rev-list --max-parents=0 HEAD`,
          # which breaks when HEAD is a merge commit: under fetch-depth 2 the
          # shallow clone grafts both parents, so both look parentless and the
          # command returns TWO shas. They were then passed as a single refspec
          # and the job died with "fatal: invalid refspec". That is exactly what
          # happened creating a branch whose tip was a promotion merge commit.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against; running the complete matrix." >&2
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "postgresql-required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A shallow checkout of GitHub's synthetic PR merge ref does not
          # guarantee that the event's base commit is present. Fetch that one
          # commit on demand so path classification cannot fail with
          # "fatal: bad object" before the required jobs are scheduled.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi

          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-paths"
          if [ ! -s "$RUNNER_TEMP/changed-paths" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          elif grep -Ev '^(docs/|.*\.md$)' "$RUNNER_TEMP/changed-paths" >/dev/null; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

          # Fails closed on an unknown path, an unreadable file, or its own
          # crash: a non-zero exit fails this job, and every downstream gate
          # keys on `needs.changes.result == 'success'`.
          python -m scripts.ci.classify_postgresql_changes \
            --paths-file "$RUNNER_TEMP/changed-paths" \
            --github-output "$GITHUB_OUTPUT"

  python-environment:
    name: Prepare Python Environment
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore Poetry installation
        id: poetry-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-v1-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.POETRY_VERSION }}

      - name: Install Poetry
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/poetry" config virtualenvs.create true
          "$HOME/.local/bin/poetry" config virtualenvs.in-project true

      - name: Remove repository development environment pointer
        run: |
          if [ -L .venv ]; then
            rm .venv
          fi

      - name: Restore Python environment
        id: python-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: python-venv-v3-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install dependencies
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Pack Python environment
        run: |
          mkdir -p "$RUNNER_TEMP/python-environment"
          tar -czf "$RUNNER_TEMP/python-environment/python-venv.tar.gz" .venv
          tar -czf "$RUNNER_TEMP/python-environment/poetry-home.tar.gz" \
            -C "$HOME" .local

      - name: Share Python environment
        uses: actions/upload-artifact@v4
        with:
          name: python-environment
          path: ${{ runner.temp }}/python-environment/
          retention-days: 1
          compression-level: 0

  lint:
    name: Lint & Format
    needs: [changes, python-environment]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || needs.python-environment.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Lint and format checks are not needed for documentation-only changes."

      # Deliberately UNGUARDED, unlike every step below it in this job: this
      # checkout exists for the strict-JSON step at the bottom, which must
      # run on EVERY invocation of this job, including a docs-only one — see
      # that step's comment for why. Skipping checkout on docs-only would
      # leave that step with no files to open at all.
      - uses: actions/checkout@v4

      - name: Verify Kernel composition observations
        uses: michaelayoade/dotmac_starter_mt/.github/actions/verify-composition-observations@8b4b6d4b42e650c47fe4c04a679a5ccb51c4b2cd
        with:
          product: sub

      - uses: ./.github/actions/setup-ci-python
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff check
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run ruff check app tests scripts alembic

      - name: Ruff format check
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run ruff format --check app tests scripts alembic

      # Strict-JSON evidence documents (docs/kernel-runtime-composition.json,
      # docs/kernel-runtime-readiness.json) are excluded from the two Ruff
      # steps above (pyproject.toml [tool.ruff] extend-exclude and
      # .pre-commit-config.yaml's per-hook exclude), because `ruff format`
      # rewrites a trailing comma into them that `json.load` then refuses.
      # This step is deliberately the very next one after "Ruff format
      # check", in the SAME job: it is the one place a formatter that
      # mangled a file in THIS run is guaranteed to be caught by the step
      # immediately after it, before anything else runs. It is not
      # redundant with tests/architecture/test_strict_json_evidence_
      # documents.py — that test catches a document that arrives broken by
      # any other route (a hand edit, a bad merge, a different tool
      # entirely); this step catches only the formatter-in-this-run case,
      # with the causal ordering Michael's ruling requires. Keep both.
      #
      # This step and the checkout above it are DELIBERATELY UNGUARDED,
      # unlike every other step in this job (Ruff check/format, setup-ci-
      # python): those guard Python linting, which genuinely has nothing to
      # do on a docs-only change. This step's entire SUBJECT is a docs/
      # file — the `changes` job's own docs-only classifier
      # (`grep -Ev '^(docs/|.*\.md$)'`) treats anything under docs/ as
      # docs-only, so a pull request that changes ONLY
      # docs/kernel-runtime-composition.json — precisely the shape every
      # future record update has — sets docs-only=true. Guarding this step
      # the same way its neighbours are guarded would make the one check
      # that exists to catch a corrupted record skip itself on exactly the
      # PRs most likely to corrupt it: a check that cannot fire when it
      # matters is the dominant defect class this programme exists to
      # retire. Do NOT "fix" an apparent guard inconsistency here by adding
      # the `docs-only != 'true'` condition back — that is precisely how
      # this defect re-enters. The `lint` job itself is not skipped on a
      # docs-only change (see its own `if:` above, which runs whenever
      # `changes` succeeds regardless of docs-only), so this step is always
      # reached when this job runs at all; it needs only the stdlib
      # (`json`, `sys` via system `python3`, not `poetry run`), so it does
      # not need `setup-ci-python`/poetry either.
      - name: Strict-JSON evidence documents parse after formatting
        run: |
          python3 -c "
          import json, sys
          paths = [
              'docs/kernel-runtime-composition.json',
              'docs/kernel-runtime-readiness.json',
          ]
          failed = False
          for path in paths:
              try:
                  with open(path, encoding='utf-8') as handle:
                      json.load(handle)
              except json.JSONDecodeError as exc:
                  failed = True
                  print(f'::error file={path}::{path} is not valid JSON after formatting: {exc}')
          sys.exit(1 if failed else 0)
          "

  type-check:
    name: Type Check
    needs: [changes, python-environment]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || needs.python-environment.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Type checking is not needed for documentation-only changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true'

      - uses: ./.github/actions/setup-ci-python
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run mypy
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run mypy app --ignore-missing-imports --no-incremental

  import-boundaries:
    name: Import Boundaries
    needs: [changes, python-environment]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || needs.python-environment.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Import-boundary checks are not needed for documentation-only changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true'

      - uses: ./.github/actions/setup-ci-python
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run import-linter
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run lint-imports

  unit-shards:
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    needs: [changes, python-environment]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || needs.python-environment.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Unit-test shard ${{ matrix.shard }} is not needed for documentation-only changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true'

      - uses: ./.github/actions/setup-ci-python
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore historical unit-test durations
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/test-durations.json
          key: unit-test-durations-v1-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            unit-test-durations-v1-${{ github.head_ref || github.ref_name }}-
            unit-test-durations-v1-${{ github.base_ref || github.ref_name }}-
            unit-test-durations-v1-

      - name: Run unit-test shard
        if: needs.changes.outputs.docs-only != 'true'
        env:
          COVERAGE_CORE: sysmon
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: >-
          make test-ci-shard
          CI_SHARD="${{ matrix.shard }}"
          CI_DURATIONS_OUTPUT=".ci-cache/current-${{ matrix.shard }}.json"

      - name: Upload coverage data
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

      - name: Upload unit-test duration data
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-durations-${{ matrix.shard }}
          path: .ci-cache/current-${{ matrix.shard }}.json
          include-hidden-files: true
          retention-days: 1

  migration-sequence:
    name: Migration Sequence Gate (report-only)
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gate is pure stdlib, so it needs neither the project virtualenv nor
      # the shared python-environment artifact — depending on either only adds
      # a failure mode unrelated to what it checks.

      # Shadow phase per docs/adr/0008-migration-sequence-ownership.md: report
      # findings without failing the build, so we can measure how many pull
      # requests this would block before making it required.
      #
      # ONE exception, and it does not touch that measurement: a pull request
      # merging an `integration/**` or `consolidate/**` branch is ENFORCED.
      # These branches carry a whole batch's migrations and live for far longer
      # than the days-long authoring-to-merge gap this gate was written for, so
      # their parents are the most likely to be stale by merge time. A stale
      # parent merges cleanly and fails at deploy, so the report has to be
      # blocking exactly when the batch lands. Regular main pull requests keep
      # reporting only, so the shadow-phase numbers stay comparable.
      - name: Check migration chains onto the base head
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch origin "$BASE" --depth=0 || true
          case "$HEAD_REF" in
            integration/*|consolidate/*) MODE="" ;;
            *)                          MODE="--report-only" ;;
          esac
          if [ -z "$MODE" ]; then
            echo "::notice::Enforcing the migration sequence gate: $HEAD_REF is a batch branch merging into $BASE."
          fi
          python3 scripts/architecture/migration_sequence_gate.py \
            --base "origin/$BASE" $MODE

  architecture:
    name: Architecture Tests
    needs: [changes, python-environment]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run architecture guards
        run: make test-architecture

  workflow-guidance:
    name: Workflow Guidance Gate
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require guidance changes with Admin workflow changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD^"
          fi
          python3 scripts/architecture/workflow_guidance_gate.py --base "$BASE"

  test:
    name: Tests
    needs: [changes, python-environment, unit-shards, architecture, workflow-guidance]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Unit and architecture tests are not needed for documentation-only changes."

      - name: Require all test groups
        if: needs.changes.outputs.docs-only != 'true'
        env:
          PYTHON_ENVIRONMENT_RESULT: ${{ needs.python-environment.result }}
          UNIT_RESULT: ${{ needs.unit-shards.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          WORKFLOW_GUIDANCE_RESULT: ${{ needs.workflow-guidance.result }}
        run: |
          test "$PYTHON_ENVIRONMENT_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$ARCHITECTURE_RESULT" = "success"
          test "$WORKFLOW_GUIDANCE_RESULT" = "success"

  coverage:
    name: Combine Coverage
    needs: [changes, python-environment, unit-shards]
    if: needs.changes.outputs.docs-only != 'true' && needs.unit-shards.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: unit-coverage-*
          merge-multiple: true

      - name: Download unit-test duration data
        uses: actions/download-artifact@v4
        with:
          pattern: unit-durations-*
          path: ${{ runner.temp }}/unit-durations
          merge-multiple: true

      - name: Create combined coverage report
        run: |
          poetry run coverage combine
          poetry run coverage xml

      - name: Prepare duration history for the next run
        run: >-
          poetry run python scripts/ci/merge_test_durations.py
          --input-dir "$RUNNER_TEMP/unit-durations"
          --output .ci-cache/test-durations.json

      - name: Save unit-test duration history
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/test-durations.json
          key: unit-test-durations-v1-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    needs: [changes, python-environment]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || needs.python-environment.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Application security scans are not needed for documentation-only changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true'

      - uses: ./.github/actions/setup-ci-python
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Security lint
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run ruff check app --select S --ignore S101,S105,S110,S112,S507,S603,S607

      - name: Bandit security scan
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run bandit -r app -c pyproject.toml -q

  pre-commit:
    name: Pre-commit
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: pre-commit/action@v3.0.1

  # Deliberately NOT part of the pre-commit job above.
  #
  # pre-commit's detect-private-key hook already existed when a real OpenVPN
  # server key was committed on 2026-01-26 — the hook fired, and the file was
  # added to its `exclude:` list rather than the key being removed. The key was
  # public until 2026-07-27.
  #
  # This job re-checks the same property with no path allowlist, keyed on
  # content instead: a PEM header with no encoded body is a placeholder and
  # passes; a header with real key material fails. There is no exclude list to
  # edit, so the only way to green it is to remove the key. Separate job so a
  # change to .pre-commit-config.yaml cannot disable it.
  secret-scan:
    name: Private Key Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for private key material
        run: bash scripts/ci/scan_private_keys.sh

  integration-shards:
    name: PostgreSQL Tests (shard ${{ matrix.shard }}/4)
    needs: [changes, python-environment]
    if: needs.changes.outputs.postgresql-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dotmac_sub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/dotmac_sub_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/dotmac_sub_test"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Restore ONLY from `main`. Scheduling history is shared state: a pull
      # request that seeded it could reshape every other run's shards, and a
      # slow or broken branch would poison the balance for everyone. Reads are
      # therefore taken from the trusted branch, and the matching save step
      # below refuses to run anywhere else.
      #
      # A cache miss is not a failure. The selector falls back to a
      # conservative per-file estimate and still partitions every file exactly
      # once -- balance degrades, coverage does not.
      - name: Restore integration-test durations from main
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/integration-test-durations.json
          key: integration-test-durations-v2-main-${{ github.run_id }}
          restore-keys: |
            integration-test-durations-v2-main-

      - name: Run integration-test shard
        env:
          INTEGRATION_SHARD: ${{ matrix.shard }}
          INTEGRATION_SHARDS: 4
        # Kept on ONE line on purpose. `test_migrated_database_test_contract.py`
        # and `test_validation_command_alignment.py` both assert the literal
        # `run: make test-integration-shard`, which is how they prove CI
        # delegates to the Makefile owner instead of inlining pytest or alembic.
        # A folded `run: >-` block satisfies the intent and breaks the check;
        # bending two guards I did not write to suit my line length is the
        # wrong trade.
        run: make test-integration-shard CI_INTEGRATION_DURATIONS_OUTPUT=".ci-cache/integration-current-${{ matrix.shard }}.json"

      - name: Upload integration-test duration data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-durations-${{ matrix.shard }}
          path: .ci-cache/integration-current-${{ matrix.shard }}.json
          include-hidden-files: true
          retention-days: 1

  integration-run:
    name: PostgreSQL Gate
    needs: [changes, integration-shards]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: PostgreSQL validation not required
        if: needs.changes.outputs.postgresql-required != 'true'
        run: echo "PostgreSQL checks are not needed for this change surface."

      - name: Require every PostgreSQL shard
        if: needs.changes.outputs.postgresql-required == 'true'
        env:
          INTEGRATION_RESULT: ${{ needs.integration-shards.result }}
        run: test "$INTEGRATION_RESULT" = "success"

      # Publishing is gated on the TRUSTED BRANCH, not merely on the event
      # type: only a green push to `main` may rewrite the shared scheduling
      # history. A pull request measures itself and throws the numbers away.
      # This step is inside the existing gate job rather than a new one so it
      # cannot run before every shard has passed.
      - name: Checkout
        if: >-
          needs.changes.outputs.postgresql-required == 'true'
          && needs.integration-shards.result == 'success'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4

      - name: Download integration-test duration data
        if: >-
          needs.changes.outputs.postgresql-required == 'true'
          && needs.integration-shards.result == 'success'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          pattern: integration-durations-*
          path: ${{ runner.temp }}/integration-durations
          merge-multiple: true

      - name: Merge integration-test durations
        if: >-
          needs.changes.outputs.postgresql-required == 'true'
          && needs.integration-shards.result == 'success'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        run: >-
          python3 scripts/ci/merge_test_durations.py
          --input-dir "$RUNNER_TEMP/integration-durations"
          --output .ci-cache/integration-test-durations.json

      - name: Publish integration-test durations for later runs
        if: >-
          needs.changes.outputs.postgresql-required == 'true'
          && needs.integration-shards.result == 'success'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/integration-test-durations.json
          key: integration-test-durations-v2-main-${{ github.run_id }}

  integration-test:
    name: Integration Tests (PostgreSQL)
    needs: [changes, integration-run]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.postgresql-required != 'true'
        run: echo "PostgreSQL checks are not needed for this change surface."

      - name: Require PostgreSQL gate
        if: needs.changes.outputs.postgresql-required == 'true'
        env:
          INTEGRATION_RESULT: ${{ needs.integration-run.result }}
        run: test "$INTEGRATION_RESULT" = "success"

  # Depends on `changes` ALONE, deliberately.
  #
  # This job checks the repository out itself and starts its own ci-db and
  # ci-redis. It consumes no artifact, image, database or output from any test
  # lane, so the previous `needs:` list bought nothing but sequencing -- roughly
  # three minutes of critical path spent waiting for evidence it never reads.
  #
  # The trade is deliberate and visible to reviewers: a pull request whose tests
  # fail can now show a GREEN Docker check, because the build genuinely did
  # succeed. Docker build success has never been evidence that the tests passed;
  # it previously looked like it was because of the ordering. The other required
  # contexts still gate the merge, so nothing lands on a green build alone.
  docker-build:
    name: Docker Build & Health Check
    needs: [changes]
    if: always() && needs.changes.result == 'success'

    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Docker validation not required
        if: needs.changes.outputs.docs-only == 'true' || github.event_name == 'push'
        run: echo "Docker validation runs before merge; branch pushes defer publication to the explicit candidate workflow."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true' && github.event_name != 'push'

      - name: Set up Docker Buildx
        if: needs.changes.outputs.docs-only != 'true' && github.event_name != 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image once
        if: needs.changes.outputs.docs-only != 'true' && github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dotmac-sub:ci
          cache-from: type=gha,scope=dotmac-sub-application
          cache-to: type=gha,mode=max,scope=dotmac-sub-application
          secrets: |
            forgejo_token=${{ secrets.FORGEJO_READ_TOKEN }}

      - name: Create CI network and services
        if: needs.changes.outputs.docs-only != 'true' && github.event_name != 'push'
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=dotmac_sub_ci \
            --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres" --health-interval 5s \
            --health-retries 10 postgis/postgis:16-3.4
          docker run -d --name ci-redis --network ci-net redis:7
          for i in $(seq 1 30); do
            [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ci-db)" = "healthy" ] && break
            sleep 2
          done
          # Exhausting the loop above used to fall through with exit 0. A
          # database that never came up was then reported by the NEXT step as
          # an opaque "database connection or role operation failed", naming
          # migrations for a fault that was service startup. Readiness is a
          # precondition of this step, so prove it here and fail loudly.
          if [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ci-db)" != "healthy" ] || ! docker exec ci-db pg_isready -h 127.0.0.1 -U postgres -d postgres >/dev/null 2>&1; then
            echo "::error::ci-db did not become ready within 60s"
            docker inspect --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ci-db || true
            docker logs ci-db || true
            exit 1
          fi
          # Redis had no readiness check at all, which is the same defect in
          # its most complete form: an unproven precondition.
          for i in $(seq 1 30); do
            docker exec ci-redis redis-cli ping >/dev/null 2>&1 && break
            sleep 2
          done
          if ! docker exec ci-redis redis-cli ping >/dev/null 2>&1; then
            echo "::error::ci-redis did not become ready within 60s"
            docker logs ci-redis || true
            exit 1
          fi

      - name: Run migrations and application health check
        if: needs.changes.outputs.docs-only != 'true' && github.event_name != 'push'
        run: |
          common_args="--network ci-net \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@ci-db:5432/dotmac_sub_ci \
            -e SECRET_KEY=ci-test-secret-key-not-for-production \
            -e REDIS_URL=redis://ci-redis:6379/0"
          docker run --rm $common_args dotmac-sub:ci sh -c \
            'BOOTSTRAP_DATABASE_URL="$DATABASE_URL" python scripts/bootstrap_commercial_module_prereqs.py'
          docker run --rm $common_args dotmac-sub:ci sh -c \
            'BOOTSTRAP_DATABASE_URL="$DATABASE_URL" python scripts/bootstrap_outbox_dispatcher_roles.py --repair'
          docker run --rm $common_args dotmac-sub:ci alembic upgrade heads
          docker run -d --name ci-app $common_args \
            -e CELERY_BROKER_URL=redis://ci-redis:6379/0 dotmac-sub:ci
          for i in $(seq 1 60); do
            status="$(docker inspect --format='{{.State.Status}}' ci-app 2>/dev/null || echo missing)"
            if [ "$status" = "exited" ]; then
              docker logs ci-app
              exit 1
            fi
            health="$(docker exec ci-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8001/health').read().decode())" 2>/dev/null || true)"
            echo "$health" | grep -qi 'ok\|healthy' && exit 0
            sleep 3
          done
          docker logs ci-app
          exit 1

      - name: Cleanup
        if: always() && needs.changes.outputs.docs-only != 'true' && github.event_name != 'push'
        run: |
          docker rm -f ci-app ci-db ci-redis 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true
