{% extends "layouts/customer.html" %}

{% block title %}Quote payment unavailable{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl rounded-2xl border border-stone-200 bg-white p-8 text-center shadow-sm dark:border-stone-700 dark:bg-stone-800">
    <h1 class="text-2xl font-bold text-stone-900 dark:text-white">Quote payment unavailable</h1>
    <p class="mt-3 text-sm text-stone-600 dark:text-stone-300">{{ message }}</p>
    <a href="/portal/quotes" class="mt-6 inline-flex rounded-xl bg-[var(--color-brand-600)] px-5 py-3 text-sm font-semibold text-white hover:bg-[var(--color-brand-700)]">Back to quotes</a>
</div>
{% endblock %}
