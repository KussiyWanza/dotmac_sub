{% macro workflow_help_control(workflow_guide, container_class="mb-3 flex justify-end", button_class="h-10 w-10") %}
<span class="{{ container_class }}" data-admin-workflow-help-control x-data="{ workflowHelpOpen: false }">
    <button type="button"
            x-on:click="workflowHelpOpen = true"
            class="group inline-flex {{ button_class }} flex-shrink-0 items-center justify-center rounded-full focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 dark:focus:ring-offset-slate-950"
            aria-label="How this page works: {{ workflow_guide.title }}"
            aria-haspopup="dialog"
            x-bind:aria-expanded="workflowHelpOpen.toString()"
            title="How this page works">
        <span class="inline-flex h-7 w-7 items-center justify-center rounded-full border border-slate-300 bg-slate-100 text-xs font-semibold leading-none text-slate-500 transition-colors group-hover:border-slate-400 group-hover:bg-slate-200 group-hover:text-slate-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:group-hover:border-slate-600 dark:group-hover:bg-slate-700 dark:group-hover:text-white"
              aria-hidden="true">?</span>
    </button>

    <template x-teleport="body">
        <div x-show="workflowHelpOpen"
             x-cloak
             x-on:keydown.escape.window="workflowHelpOpen = false"
             class="fixed inset-0 overflow-y-auto"
             style="z-index: 3000;"
             role="dialog"
             aria-modal="true"
             aria-labelledby="workflow-help-title"
             aria-describedby="workflow-help-purpose">
            <div x-show="workflowHelpOpen"
                 x-transition.opacity
                 x-on:click="workflowHelpOpen = false"
                 class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm"></div>
            <div class="flex min-h-full items-center justify-center p-4">
                <section x-show="workflowHelpOpen"
                         x-transition:enter="ease-out duration-200"
                         x-transition:enter-start="opacity-0 scale-95"
                         x-transition:enter-end="opacity-100 scale-100"
                         x-transition:leave="ease-in duration-150"
                         x-transition:leave-start="opacity-100 scale-100"
                         x-transition:leave-end="opacity-0 scale-95"
                         x-trap.inert.noscroll="workflowHelpOpen"
                         x-on:click.stop
                         class="relative w-full max-w-lg overflow-hidden rounded-lg border border-slate-200 bg-white shadow-2xl dark:border-slate-700 dark:bg-slate-900">
                    <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4 dark:border-slate-700">
                        <div>
                            <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">{{ workflow_guide.title }}</p>
                            <h2 id="workflow-help-title" class="mt-1 font-display text-lg font-bold text-slate-900 dark:text-white">Page Overview</h2>
                        </div>
                        <button type="button"
                                x-on:click="workflowHelpOpen = false"
                                class="inline-flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
                                aria-label="Close page help">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </header>
                    <div class="max-h-[70vh] overflow-y-auto px-5 py-4">
                        <p id="workflow-help-purpose" class="text-sm leading-6 text-slate-600 dark:text-slate-300">{{ workflow_guide.purpose }}</p>
                        <div class="mt-4 inline-flex max-w-full items-start gap-1.5 rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1 text-[11px] leading-4 text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">
                            <svg class="mt-0.5 h-3 w-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9h.01M11 12h1v4h1m8-4a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <span>Showing actions available to your role. Other actions may be hidden, and some shown actions may depend on the record's status.</span>
                        </div>
                        <h3 class="mt-5 text-sm font-semibold text-slate-900 dark:text-white">What you can do on this page</h3>
                        <ul class="mt-3 space-y-2 text-sm text-slate-700 dark:text-slate-200">
                            {% for action in admin_help_actions_for(workflow_guide) %}
                            {% if not action.permission or can(request, action.permission) %}
                            <li class="flex items-start gap-2.5 rounded-lg border border-slate-200 px-3 py-2.5 dark:border-slate-700">
                                <svg class="mt-0.5 h-4 w-4 flex-shrink-0 text-teal-600 dark:text-teal-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 13 4 4L19 7"/></svg>
                                <span>{{ action.title }}</span>
                            </li>
                            {% endif %}
                            {% endfor %}
                        </ul>
                    </div>
                    <footer class="flex justify-end border-t border-slate-200 bg-slate-50 px-5 py-4 dark:border-slate-700 dark:bg-slate-800/60">
                        <a class="text-sm font-semibold text-teal-700 underline-offset-4 hover:underline focus:outline-none focus:ring-2 focus:ring-teal-500 dark:text-teal-300"
                           href="/admin/help?article={{ workflow_guide.id|urlencode }}">Open full help</a>
                    </footer>
                </section>
            </div>
        </div>
    </template>
</span>
{% endmacro %}
