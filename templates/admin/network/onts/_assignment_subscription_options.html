<label for="modal_subscription_id" class="block text-sm font-medium text-slate-700 dark:text-slate-300">
    Service Subscription <span class="text-red-500">*</span>
</label>
<select id="modal_subscription_id"
        name="subscription_id"
        required
        {% if not assignment_account_id or not assignment_subscription_options %}disabled{% endif %}
        class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:border-cyan-500 focus:ring-cyan-500 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500 dark:border-slate-600 dark:bg-slate-700 dark:text-white dark:disabled:bg-slate-900 dark:disabled:text-slate-500">
    {% if not assignment_account_id %}
    <option value="">Select a subscriber first</option>
    {% elif not assignment_subscription_options %}
    <option value="">No subscriptions found for this subscriber</option>
    {% else %}
    <option value="">Select a subscription</option>
    {% for option in assignment_subscription_options %}
    <option value="{{ option.id }}" {% if selected_assignment_subscription_id == option.id|string %}selected{% endif %}>
        {{ option.offer_name }}{% if option.service_login %} · {{ option.service_login }}{% endif %} — {{ option.status_indicator }}
    </option>
    {% endfor %}
    {% endif %}
</select>
{% if assignment_account_id and assignment_subscription_options %}
<p class="mt-1.5 text-xs text-slate-500 dark:text-slate-400">
    All subscriptions for this subscriber are shown. Non-active subscriptions include their current status.
</p>
{% elif assignment_account_id %}
<p class="mt-1.5 text-xs font-medium text-amber-700 dark:text-amber-300">
    This subscriber has no service subscription to assign.
</p>
{% endif %}
