<div id="ticket-status-summary"
     {% if ticket_oob | default(false) %}hx-swap-oob="outerHTML"{% endif %}
     class="overflow-x-auto rounded-xl border border-slate-200 bg-white p-1 shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <div class="flex min-w-max items-center gap-1 md:min-w-0">
        {% for card in status_summary_cards %}
        <a href="{{ card.href }}"
           hx-get="{{ card.href }}"
           hx-target="#tickets-table"
           hx-push-url="true"
           hx-on::after-request="if (event.detail.successful) document.getElementById('ticket-status-filter').value = this.dataset.ticketStatus"
           data-ticket-status="{{ card.value }}"
           {% if card.active %}aria-current="page"{% endif %}
           class="flex min-w-36 flex-1 items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition {% if card.active %}bg-primary-600 text-white shadow-sm{% else %}text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-700/60{% endif %}">
            <span>{{ card.label }}</span>
            <span class="rounded-full px-2 py-0.5 text-xs tabular-nums {% if card.active %}bg-white/20 text-white{% else %}bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-300{% endif %}">{{ card.count }}</span>
        </a>
        {% endfor %}
    </div>
</div>
