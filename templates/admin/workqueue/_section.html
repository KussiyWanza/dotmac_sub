<section aria-labelledby="section-{{ section.item_kind.value }}-heading">
    <div class="mb-3 flex items-center justify-between">
        <h2 id="section-{{ section.item_kind.value }}-heading" class="text-lg font-semibold text-slate-900 dark:text-white">{{ section.label }}</h2>
        <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 dark:bg-slate-700 dark:text-slate-200">{{ section.total }}</span>
    </div>
    <div class="space-y-3">
        {% for row in section.rows %}
            {% include "admin/workqueue/_row.html" %}
        {% else %}
        <div class="rounded-xl border border-dashed border-slate-300 bg-white px-6 py-8 text-center text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-800">No {{ section.label|lower }} match this scope.</div>
        {% endfor %}
    </div>
</section>
